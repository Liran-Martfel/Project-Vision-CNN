[theme]
base = "light"
primaryColor = "#24407a"
backgroundColor = "#f4efe6"
secondaryBackgroundColor = "#fbf8f2"
textColor = "#1b2a4a"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[server]
maxUploadSize = 50  # above the API's 10 MB, so the app shows its own translated "too large" message

[browser]
gatherUsageStats = false
